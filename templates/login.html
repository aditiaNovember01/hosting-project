<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShareHosting Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4338ca 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: #fff; border-radius: 20px; padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
        }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand .icon {
            width: 64px; height: 64px; background: #4f46e5;
            border-radius: 16px; display: inline-flex;
            align-items: center; justify-content: center;
            font-size: 28px; color: #fff; margin-bottom: 16px;
        }
        .brand h1 { font-size: 1.5rem; font-weight: 700; color: #1e1b4b; margin: 0; }
        .brand p { color: #64748b; font-size: .9rem; margin: 4px 0 0; }
        .form-control {
            border-radius: 10px; padding: 12px 16px;
            border: 1px solid #e2e8f0; background: #f8fafc;
        }
        .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        .input-group-text { border-radius: 10px 0 0 10px; background: #f8fafc; border-color: #e2e8f0; }
        .btn-login {
            width: 100%; padding: 12px; border-radius: 10px;
            background: #4f46e5; border: none; color: #fff;
            font-weight: 600; font-size: 1rem; transition: all .2s;
        }
        .btn-login:hover { background: #3730a3; transform: translateY(-1px); }
        .tab-role .btn { border-radius: 8px; font-size: .85rem; }
        .alert { border-radius: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="icon"><i class="fas fa-server"></i></div>
            <h1>ShareHosting Panel</h1>
            <p>Masuk ke panel hosting Anda</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <!-- Toggle User / Admin -->
            <div class="tab-role d-flex gap-2 mb-4">
                <button type="button" class="btn btn-primary flex-fill active" id="btn-user"
                    onclick="setRole('user')">
                    <i class="fas fa-user me-1"></i> User
                </button>
                <button type="button" class="btn btn-outline-secondary flex-fill" id="btn-admin"
                    onclick="setRole('admin')">
                    <i class="fas fa-shield-alt me-1"></i> Admin
                </button>
            </div>
            <input type="hidden" name="login_as" id="login_as" value="user">

            <div class="mb-3">
                <label class="form-label fw-semibold text-muted small">USERNAME</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control"
                        placeholder="Masukkan username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold text-muted small">PASSWORD</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" name="password" id="password" class="form-control"
                        placeholder="Masukkan password" required>
                    <button class="btn btn-outline-secondary" type="button"
                        onclick="togglePwd()">
                        <i class="fas fa-eye" id="eye-icon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>Masuk
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">ShareHosting &copy; 2026</small>
        </div>
    </div>

    <script>
        function setRole(role) {
            document.getElementById('login_as').value = role;
            const btnUser = document.getElementById('btn-user');
            const btnAdmin = document.getElementById('btn-admin');
            if (role === 'admin') {
                btnAdmin.className = 'btn btn-primary flex-fill';
                btnUser.className = 'btn btn-outline-secondary flex-fill';
            } else {
                btnUser.className = 'btn btn-primary flex-fill';
                btnAdmin.className = 'btn btn-outline-secondary flex-fill';
            }
        }
        function togglePwd() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
    </script>
</body>
</html>
